name: Shared macOS 15 verification

on:
  workflow_call:
    inputs:
      package-version:
        description: Version embedded in the verified app bundle
        required: true
        type: string
    outputs:
      artifact-id:
        description: Artifact containing the verified DMG from this run
        value: ${{ jobs.build-test-package.outputs.artifact-id }}
      dmg-sha256:
        description: SHA-256 of the verified DMG bytes
        value: ${{ jobs.build-test-package.outputs.dmg-sha256 }}

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: macos-15
    outputs:
      artifact-id: ${{ steps.upload-package.outputs.artifact-id }}
      dmg-sha256: ${{ steps.package-digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Record macOS and Swift toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test release artifact validation
        run: python3 -m unittest discover -s Tests/WorkflowTests -p 'test_*.py'

      # The render heartbeat has a 200 ms deadline and the HTML export heartbeat
      # has a 2 s deadline. Run each in its own process so unrelated MainActor
      # tests cannot consume its time budget. The inline and block scaling suites
      # also need separate processes: concurrent suites can distort their ratios.
      # Every exclusion below has a mandatory isolated gate before packaging.
      - name: Run default tests (GUI suites run in gui-tests)
        run: swift test --skip 'P1RegressionTests.renderingYieldsMainActorAndLatestRevisionWins' --skip 'InlineRenderingPerformanceTests' --skip 'SelfContainedHTMLExportTests.exportImageBuilderRunsOffMainActorWhileInputCanContinue' --skip 'BlockRenderingPerformanceTests'

      - name: Verify inline scaling ratios in isolation
        run: swift test --filter 'InlineRenderingPerformanceTests'

      - name: Verify block scaling ratios in isolation
        run: swift test --filter 'BlockRenderingPerformanceTests'

      - name: Verify main actor heartbeats in isolation
        run: |
          set -euo pipefail
          swift test --filter 'P1RegressionTests.renderingYieldsMainActorAndLatestRevisionWins'
          swift test --filter 'SelfContainedHTMLExportTests.exportImageBuilderRunsOffMainActorWhileInputCanContinue'

      - name: Build and package without installing or publishing
        env:
          CI: "true"
          MARKDOWN2_VERSION: ${{ inputs.package-version || 'v0.0.0' }}
        run: bash Scripts/package_app.sh --release

      - name: Verify macOS 15 floor and packaged app
        env:
          PACKAGE_VERSION: ${{ inputs.package-version || 'v0.0.0' }}
        run: |
          set -euo pipefail
          minos="$(otool -l dist/Markdown2.app/Contents/MacOS/Markdown2 | awk '/cmd LC_BUILD_VERSION/ { found=1 } found && $1 == "minos" { print $2; exit }')"
          test "$minos" = "15.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' dist/Markdown2.app/Contents/Info.plist)" = "15.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Markdown2.app/Contents/Info.plist)" = "${PACKAGE_VERSION#v}"
          plutil -lint dist/Markdown2.app/Contents/Info.plist
          test -f dist/Markdown2.app/Contents/Resources/AppIcon.icns
          test -d dist/Markdown2.app/Contents/Resources/MD2_MD2Core.bundle
          codesign --verify --deep --strict dist/Markdown2.app

      - name: Verify local DMG and app signature inside
        run: |
          set -euo pipefail
          hdiutil create -volname Markdown2 -srcfolder dist/Markdown2.app -ov -format UDZO dist/Markdown2.dmg
          hdiutil verify dist/Markdown2.dmg
          mount_dir="$(mktemp -d)"
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; rmdir "$mount_dir" 2>/dev/null || true' EXIT
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mount_dir" dist/Markdown2.dmg
          codesign --verify --deep --strict "$mount_dir/Markdown2.app"

      # The release job consumes these exact bytes; it never rebuilds the app.
      - name: Record package identity and digest
        id: package-digest
        env:
          PACKAGE_VERSION: ${{ inputs.package-version || 'v0.0.0' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > dist/source-commit.txt
          printf '%s\n' "$PACKAGE_VERSION" > dist/package-version.txt
          digest="$(shasum -a 256 dist/Markdown2.dmg | awk '{ print $1 }')"
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Keep the verified package for this run
        id: upload-package
        uses: actions/upload-artifact@v4
        with:
          name: verified-macos-package-${{ github.run_attempt }}
          path: |
            dist/Markdown2.dmg
            dist/source-commit.txt
            dist/package-version.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  gui-tests:
    # The MD2_RUN_GUI_TESTS suites guard failures that throw nothing: dark or
    # clipped PDFs, a Settings window that opens itself at launch, gutters that
    # stop drawing, undo that crashes after a mode switch. GitHub's macOS
    # runners log in a user session with a window server, so AppKit windows
    # and WebKit render here as they do on a developer's Mac.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Record macOS and Swift toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # This job runs XCTest only. Every GUI-gated case is an XCTest case, and
      # the Swift Testing suites (timing ratios, the heartbeat) already run in
      # build-test-package; running them twice would only double their noise.
      - name: Check that GUI-gated tests are XCTest cases
        run: |
          # /dev/null keeps grep off stdin if no file imports Testing.
          if grep -l 'MD2_RUN_GUI_TESTS' /dev/null $(grep -rl '^import Testing' Tests); then
            echo "::error::The Swift Testing files above read MD2_RUN_GUI_TESTS, but gui-tests runs XCTest only. Write GUI-gated cases as XCTest cases."
            exit 1
          fi

      - name: Run XCTest with GUI suites enabled
        env:
          MD2_RUN_GUI_TESTS: "1"
        run: |
          set -o pipefail
          swift test --disable-swift-testing 2>&1 | tee "$RUNNER_TEMP/gui-tests.log"

      # A skipped GUI test passes green, so every skip must be one the
      # allowlist expects on this runner.
      - name: Reject unexpected skips
        if: ${{ !cancelled() }}
        run: python3 Scripts/check_test_skips.py "$RUNNER_TEMP/gui-tests.log" .github/gui-expected-skips.txt

  # This read-only consumer runs in PRs and tags. It verifies job output and
  # artifact handoff only after both test jobs succeed.
  artifact-handoff:
    needs: [build-test-package, gui-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download this run's verified package
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-test-package.outputs.artifact-id }}
          merge-multiple: true
          path: dist

      - name: Verify package identity and unchanged bytes
        env:
          PACKAGE_VERSION: ${{ inputs.package-version }}
          EXPECTED_DMG_SHA256: ${{ needs.build-test-package.outputs.dmg-sha256 }}
        run: |
          set -euo pipefail
          python3 Scripts/verify_release_artifact.py dist \
            --commit "$GITHUB_SHA" \
            --version "$PACKAGE_VERSION" \
            --sha256 "$EXPECTED_DMG_SHA256"
