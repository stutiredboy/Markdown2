name: Release

on:
  # Exercise the complete reusable verification without creating a release.
  workflow_dispatch:
    inputs:
      package-version:
        description: Test package version (manual runs never publish)
        required: true
        default: v0.0.0
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # A local reusable workflow resolves at the same commit as this caller.
  # All three shared verification jobs must succeed, including artifact handoff.
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      package-version: ${{ inputs.package-version || github.ref_name }}

  release:
    needs: verify
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download this run's verified package
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          merge-multiple: true
          path: dist

      - name: Verify package identity and unchanged bytes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_DMG_SHA256: ${{ needs.verify.outputs.dmg-sha256 }}
        run: |
          set -euo pipefail
          python3 Scripts/verify_release_artifact.py dist \
            --commit "$GITHUB_SHA" \
            --version "$RELEASE_TAG" \
            --sha256 "$EXPECTED_DMG_SHA256"
          # Refuse a tag that moved while verification was running.
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/md2-release/tag"
          test "$(git rev-parse 'refs/md2-release/tag^{commit}')" = "$GITHUB_SHA"
          mv dist/Markdown2.dmg "dist/Markdown2-${RELEASE_TAG}.dmg"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
