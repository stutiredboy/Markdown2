name: PR macOS 15 verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # PRs exercise the same workflow_call, tests, and artifact handoff as tags.
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      package-version: v0.0.0

  # Consume the reusable workflow's public outputs, just as release.yml does.
  # Only download/hash work is repeated; Swift, GUI, and packaging each run once.
  verify-outputs:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download the artifact returned by the reusable workflow
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          merge-multiple: true
          path: dist

      - name: Verify the returned package and digest
        env:
          EXPECTED_DMG_SHA256: ${{ needs.verify.outputs.dmg-sha256 }}
        run: |
          set -euo pipefail
          python3 Scripts/verify_release_artifact.py dist \
            --commit "$GITHUB_SHA" \
            --version v0.0.0 \
            --sha256 "$EXPECTED_DMG_SHA256"
