name: PR macOS 15 verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gui-tests:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build --build-tests

      - name: Probe forced kill
        env:
          MD2_RUN_GUI_TESTS: "1"
          MD2_PROBE_ITERATIONS: "400"
          MD2_PROBE_LOG: ${{ runner.temp }}/probe.log
        run: |
          set -o pipefail
          swift test --disable-swift-testing --filter 'SettingsWindowPresentationGUITests/testProbeForcedKill' 2>&1 | tail -30

      - name: Show probe log
        if: ${{ !cancelled() }}
        run: cat "$RUNNER_TEMP/probe.log"
